name: DCO
on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            email=$(git log -1 --format='%ae' "$sha")
            if ! git log -1 --format='%B' "$sha" | grep -i '^Signed-off-by: ' | grep -qiF "<${email}>"; then
              echo "Missing or mismatched Signed-off-by (author <${email}>): $sha $(git log -1 --format=%s "$sha")"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Fix with: git rebase --signoff origin/main && git push --force-with-lease"
            exit 1
          fi
          echo "All commits signed off."
